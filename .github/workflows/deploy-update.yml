name: Dashboard Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      UPDATE_SOURCE_REPOSITORY: ${{ vars.UPDATE_SOURCE_REPOSITORY || 'hieunc229/mailflare' }}

    steps:
      - name: Check update token
        env:
          UPDATE_TOKEN: ${{ secrets.MAILFLARE_UPDATE_TOKEN }}
        run: |
          if [ -z "${UPDATE_TOKEN}" ]; then
            echo "::error::Add MAILFLARE_UPDATE_TOKEN as a repository Actions secret."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAILFLARE_UPDATE_TOKEN }}
          persist-credentials: true

      - name: Replace repository with upstream source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "mailflare-update"
          git config user.email "mailflare-update@users.noreply.github.com"

          upstream_url="https://github.com/${UPDATE_SOURCE_REPOSITORY}.git"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "${upstream_url}"
          else
            git remote add upstream "${upstream_url}"
          fi

          echo "Fetching upstream repository..."
          git fetch --no-tags upstream

          upstream_branch="$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"

          if [ -z "${upstream_branch}" ] || [ "${upstream_branch}" = "(unknown)" ]; then
            echo "::error::Could not resolve upstream default branch."
            exit 1
          fi

          upstream_ref="upstream/${upstream_branch}"

          echo "Replacing ${GITHUB_REF_NAME} with ${upstream_ref}."

          # Replace tracked files with the upstream version.
          # Preserve the installation repository's commit history.
          git read-tree --reset -u "${upstream_ref}"

          # Preserve this update workflow.
          git checkout HEAD -- .github/workflows/deploy-update.yml

          # Stage all additions, modifications, and deletions.
          git add -A

          # Stop when there are no changes.
          if git diff --cached --quiet; then
            echo "Repository is already up to date."
            exit 0
          fi

          echo "Changes detected:"
          git diff --cached --stat

          # Commit the upstream update.
          git commit -m "Update Mailflare from ${UPDATE_SOURCE_REPOSITORY}@${upstream_branch}"

      - name: Push update
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git log "origin/${GITHUB_REF_NAME}..HEAD" --oneline)" ]; then
            echo "Repository is already up to date."
            exit 0
          fi

          echo "Pushing updated files..."
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "Dashboard update completed successfully."
