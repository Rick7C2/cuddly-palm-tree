name: Dashboard Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UPDATE_SOURCE_REPOSITORY: ${{ vars.UPDATE_SOURCE_REPOSITORY || 'hieunc229/mailflare' }}

    steps:
      - name: Check update token
        env:
          UPDATE_TOKEN: ${{ secrets.MAILFLARE_UPDATE_TOKEN }}
        run: |
          if [ -z "${UPDATE_TOKEN}" ]; then
            echo "::error::Add MAILFLARE_UPDATE_TOKEN as a repository Actions secret."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAILFLARE_UPDATE_TOKEN }}

      - name: Replace repository with upstream source
        run: |
          set -euo pipefail
          git config user.name "mailflare-update"
          git config user.email "mailflare-update@users.noreply.github.com"

          upstream_url="https://github.com/${UPDATE_SOURCE_REPOSITORY}.git"
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "${upstream_url}"
          else
            git remote add upstream "${upstream_url}"
          fi
          git fetch --no-tags upstream

          upstream_branch="$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          if [ -z "${upstream_branch}" ]; then
            echo "::error::Could not resolve the default branch of ${UPDATE_SOURCE_REPOSITORY}."
            exit 1
          fi
          upstream_ref="upstream/${upstream_branch}"
          echo "Replacing ${GITHUB_REF_NAME} with ${upstream_ref}."

          # Keep the installation repository's commit history while replacing
          # its complete tracked tree with the current upstream tree.
          git read-tree --reset -u "${upstream_ref}"
          # Private build: keep this updater, then re-apply the license patch.
          git checkout HEAD -- .github/workflows/deploy-update.yml
          git apply --3way <<'PATCH'
          diff --git a/src/lib/licenses/paymug.ts b/src/lib/licenses/paymug.ts
          index 1f0e5f4..2b12237 100644
          --- a/src/lib/licenses/paymug.ts
          +++ b/src/lib/licenses/paymug.ts
          @@ -7,6 +7,17 @@ export async function callPaymugLicenseApi(
              action: PaymugLicenseAction,
              input: LicenseActivationInput | LicenseDeactivationInput,
           ): Promise<PaymugLicenseResponse> {
          +   // Private build: answer locally with the shape app.paymug.co returns instead of calling it.
          +   if (action === "deactivate") return { valid: false, state: "deactivated", instanceId: input.instanceId };
          +   return {
          +           valid: true,
          +           state: "active",
          +           instanceId: input.instanceId,
          +           plan: "pro",
          +           features: ["email_campaigns", "automations", "affiliates", "pages", "multi_store", "private_github"],
          +           seatLimit: null,
          +   };
          +
              let response: Response;

              console.log(input);
          PATCH
          if git diff --cached --quiet; then
            echo "Repository is already up to date."
            exit 0
          fi
          git commit -m "Update Mailflare from ${UPDATE_SOURCE_REPOSITORY}@${upstream_branch}"

      - name: Push update
        run: |
          set -euo pipefail
          if [ -z "$(git log "origin/${GITHUB_REF_NAME}..HEAD" --oneline)" ]; then
            echo "Repository is already up to date."
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
